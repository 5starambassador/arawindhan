backend:
  name: git-gateway
  branch: main

# Local development mode: allows managing files directly on disk via local proxy
local_backend: true

media_folder: "public/images"
public_folder: "/images"

site_url: "https://www.arawindhan.com"
display_url: "https://www.arawindhan.com"
logo_url: "/images/portrait.jpg"

collections:
  # 1. CORE VISUAL ASSETS
  - name: "site_imagery"
    label: "Website Images & Photography"
    files:
      - name: "primary_portraits"
        label: "Leadership Portraits"
        file: "src/data/site_images.json"
        fields:
          - { label: "Executive Portrait (Homepage & Global Header)", name: "executive_portrait", widget: "image", default: "/images/portrait.jpg", hint: "Recommended: 800x1000px JPG" }
          - { label: "Spiritual Portrait (Divya Yogam & Inner Journey)", name: "spiritual_portrait", widget: "image", default: "/images/spiritual_portrait.jpg", hint: "Recommended: 800x1000px JPG" }

      - name: "section_banners"
        label: "Page Banners & Hero Visuals"
        file: "src/data/section_banners.json"
        fields:
          - { label: "World Records Demonstration Banner", name: "records_showcase", widget: "image", default: "/images/records_showcase.jpg", hint: "Shown on Homepage & Recognition page (1920x1080px)" }
          - { label: "Whole-Brain Classroom Banner", name: "education_hero", widget: "image", default: "/images/education_hero.jpg", hint: "Shown on Education page (1920x1080px)" }
          - { label: "Global Keynote Stage Banner", name: "media_hero", widget: "image", default: "/images/media_hero.jpg", hint: "Shown on Media & Speeches page (1920x1080px)" }
          - { label: "National Awards Trophy Banner", name: "awards_trophy", widget: "image", default: "/images/awards_trophy.jpg", hint: "Shown on Recognition / Accreditations (1920x1080px)" }
          - { label: "Heguru Neuroplasticity Learning Centre Banner", name: "heguru_center", widget: "image", default: "/images/heguru_center.jpg", hint: "Shown on Institutions / Heguru section (1920x1080px)" }
          - { label: "28-Year Odyssey & Campus Vision Banner", name: "biography_vision", widget: "image", default: "/images/biography_vision.jpg", hint: "Shown on Biography Genesis section (1920x1080px)" }

  # 2. PUBLISHED BOOKS
  - name: "books"
    label: "Published Books & Treatise"
    folder: "src/data/books_content"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Book ID", name: "id", widget: "string" }
      - { label: "URL Slug", name: "slug", widget: "string" }
      - { label: "3D Book Cover Art", name: "coverImage", widget: "image", hint: "Recommended: 600x900px vertical 2:3 JPG" }
      - { label: "Title (English)", name: "title_en", widget: "string" }
      - { label: "Title (Tamil)", name: "title_ta", widget: "string" }
      - { label: "Tagline (English)", name: "tagline_en", widget: "string" }
      - { label: "Tagline (Tamil)", name: "tagline_ta", widget: "string" }
      - { label: "Author (English)", name: "author_en", widget: "string", default: "Dr. J. Arawindhan" }
      - { label: "Author (Tamil)", name: "author_ta", widget: "string", default: "முனைவர் ஜே. அரவிந்தன்" }
      - { label: "Publication Edition", name: "edition", widget: "string" }
      - { label: "Status Badge", name: "status", widget: "select", options: ["Published & Distributed", "Ecosystem Edition", "Curriculum Core"] }
      - { label: "Claim ID", name: "claimId", widget: "string" }
      - { label: "Summary Synopsis (English)", name: "summary_en", widget: "text" }
      - { label: "Summary Synopsis (Tamil)", name: "summary_ta", widget: "text" }
      - { label: "Core Key Themes (English)", name: "keyThemes_en", widget: "list" }
      - { label: "Core Key Themes (Tamil)", name: "keyThemes_ta", widget: "list" }
      - { label: "Target Audience (English)", name: "targetAudience_en", widget: "string" }
      - { label: "Target Audience (Tamil)", name: "targetAudience_ta", widget: "string" }

  # 3. SPEECHES & MEDIA ARCHIVE
  - name: "speeches"
    label: "Speeches & Media Articles"
    folder: "src/data/media_content"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Article ID", name: "id", widget: "string" }
      - { label: "Date / Year", name: "date", widget: "string" }
      - { label: "Category (English)", name: "category_en", widget: "string" }
      - { label: "Category (Tamil)", name: "category_ta", widget: "string" }
      - { label: "Title (English)", name: "title_en", widget: "string" }
      - { label: "Title (Tamil)", name: "title_ta", widget: "string" }
      - { label: "Full Content (English)", name: "fullContent_en", widget: "text" }
      - { label: "Full Content (Tamil)", name: "fullContent_ta", widget: "text" }
